<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHOST Productivity Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container text-center mt-5">
  <h1 class="title">🔥 GHOST Productivity Dashboard 2.0 🔥</h1>
  <p id="quote" class="mt-3">"Let's Cook... but they'll never know who cooked it"</p>

  <div class="tasks">
    <input type="text" id="taskInput" class="form-control mb-3" placeholder="Enter Task...">
    <button onclick="addTask()" class="btn btn-dark">Add Task</button>
  </div>

  <ul id="taskList" class="list-group mt-4"></ul>

  <div class="xp mt-4">
    <h3>XP: <span id="xpCount">0</span></h3>
  </div>

  <div class="badge mt-4">
    <h3>Rank: <span id="rank">💀 Newbie Ghost</span></h3>
  </div>
</div>

<script>
  let xp = 0;

  function addTask() {
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    if (taskInput.value === "") return;

    const task = document.createElement("li");
    task.className = "list-group-item d-flex justify-content-between align-items-center";
    task.innerHTML = `${taskInput.value} <button onclick="completeTask(this)" class="btn btn-success">✅</button>`;
    taskList.appendChild(task);
    taskInput.value = "";
  }

  function completeTask(button) {
    button.parentElement.remove();
    xp += 10;
    document.getElementById("xpCount").innerText = xp;
    updateRank();
  }

  function updateRank() {
    const rank = document.getElementById("rank");
    if (xp >= 100) rank.innerText = "🔥 Sigma Ghost";
    else if (xp >= 50) rank.innerText = "😈 Rising Ghost";
    else rank.innerText = "💀 Newbie Ghost";
  }
</script>
</body>
</html>
